<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Background Gradient Baru (Nuansa Biru Laut) */
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 20px;
        }

        /* --- Container Kartu --- */
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 1s ease;
            position: relative;
        }

        /* --- Foto Profil --- */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4facfe;
            margin-bottom: 20px;
            padding: 3px;
            background-color: white;
            transition: transform 0.3s;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        /* --- Teks --- */
        .name {
            font-size: 26px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .role {
            font-size: 15px;
            color: #4facfe;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .bio-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* --- Tombol Lanjut ke Home --- */
        .btn-enter {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.6);
        }

        /* --- Animasi --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
        
        <h1 class="name">Nama Anda</h1>
        <p class="role">Creative Designer</p>
        
        <div class="divider"></div>

        <p class="bio-text">
            Halo! Saya adalah seorang profesional yang menyukai desain minimalis dan coding. Selamat datang di portofolio pribadi saya.
        </p>

        <a href="home.html" class="btn-enter">
            Masuk ke Beranda &rarr;
        </a>
    </div>

</body>
</html>
