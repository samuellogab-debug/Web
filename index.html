<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Background Gradient Keren */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* --- Container Kartu Biodata --- */
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            /* Animasi Muncul */
            animation: fadeIn 1.5s ease;
            position: relative;
            overflow: hidden;
        }

        /* Dekorasi lingkaran di belakang (opsional) */
        .card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: rgba(118, 75, 162, 0.1);
            border-radius: 50%;
            z-index: 0;
        }

        /* --- Foto Profil --- */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #764ba2;
            margin-bottom: 20px;
            padding: 3px;
            background-color: white;
            position: relative;
            z-index: 1;
        }

        /* --- Tipografi --- */
        .name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .role {
            font-size: 14px;
            color: #764ba2;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .info-list {
            text-align: left;
            margin-bottom: 30px;
            font-size: 14px;
            color: #555;
            list-style: none;
        }

        .info-list li {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .info-list span {
            font-weight: 600;
            color: #333;
        }

        /* --- Tombol Lanjut (CTA) --- */
        .btn-continue {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        /* --- Animasi --- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Foto Profil" class="profile-img">
        
        <h1 class="name">Nama Anda</h1>
        <p class="role">Web Developer & Designer</p>

        <ul class="info-list">
            <li>
                TTL <span>Jakarta, 1 Jan 2000</span>
            </li>
            <li>
                Status <span>Mahasiswa / Bekerja</span>
            </li>
            <li>
                Hobi <span>Coding, Desain, Musik</span>
            </li>
            <li>
                Email <span>email@contoh.com</span>
            </li>
        </ul>

        <a href="https://samproject.biz.id" class="btn-continue">
            Lanjut ke Website Utama
        </a>
    </div>

</body>
</html>
